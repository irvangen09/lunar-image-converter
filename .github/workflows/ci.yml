name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: composer lint:php

  javascript:
    name: JS and CSS lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run lint:js

      - run: npm run lint:css

  php-tests:
    name: PHP tests (${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.4']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - run: composer install --no-interaction --no-progress

      - run: composer test

  release-tag:
    name: Release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare the tag with the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n 's/^ \* Version:[[:space:]]*//p' lunar-image-converter.php | head -n 1 | tr -d '[:space:]')"
          constant="$(sed -n "s/^define( 'LUNAR_IMAGE_CONVERTER_VERSION', '\(.*\)' );.*/\1/p" lunar-image-converter.php | tr -d '[:space:]')"
          package="$(node -p "require('./package.json').version")"
          echo "tag=$tag header=$header constant=$constant package=$package"
          test -n "$tag" && test "$tag" = "$header" && test "$tag" = "$constant" && test "$tag" = "$package"
